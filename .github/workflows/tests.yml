name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run profiler JavaScript tests
        run: node --test tests/agwebui/*.test.mjs tests/agwebui/test_live_follow.cjs

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  # Sandbox + harness tests. These are sensitive to CPU contention
  # (cgroup throughput assertions, wall-clock budgets, ptrace timing), so
  # every shard runs serially on its own runner -- never with xdist.
  # Shards are balanced by test count; rebalance when large test files
  # are added.
  sandbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install -e ".[dev]"

      - name: Install harness CLIs
        # Each of the 8 shards downloads the same harness packages from
        # external CDNs; concurrent bursts occasionally hit TLS handshake
        # timeouts, so retry the whole install before failing the shard.
        run: |
          for attempt in 1 2 3; do
            uv run agency install-harnesses && break
            echo "install-harnesses attempt $attempt failed; retrying..."
            sleep 10
            if [ "$attempt" = "3" ]; then exit 1; fi
          done

      - name: Install sandbox backends (podman, docker, chroot)
        run: |
          sudo apt-get update
          # debootstrap: builds the one-time chroot filesystem template
          # (run under the runner's passwordless sudo by the template
          # builder on first use).
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs debootstrap
          # The chroot backend needs unprivileged user namespaces, which
          # Ubuntu 24.04 restricts through AppArmor by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker --version
          podman --version

      - name: Pull sandbox base image into docker and podman
        # Docker and podman keep separate image stores; pull once so tests
        # do not each pay for (or flake on) the download.
        run: |
          docker pull docker.io/library/python:3.12-slim
          podman pull docker.io/library/python:3.12-slim

      - name: Verify all three sandbox backends are usable
        # The sandbox tests skip a backend that is unusable on the host.
        # Fail loudly here instead, so a broken runner cannot turn a whole
        # backend's coverage into silent skips.
        run: |
          docker info > /dev/null
          podman info > /dev/null
          uv run python - <<'EOF'
          from tests.sandbox.conftest import ALL_BACKENDS, backend_available

          missing = [kind for kind in ALL_BACKENDS if not backend_available(kind)]
          assert not missing, f"sandbox backends unusable on this runner: {missing}"
          print("usable sandbox backends:", ", ".join(ALL_BACKENDS))
          EOF

      - name: Build the chroot filesystem template
        # One-time (~minutes) debootstrap build. Doing it here keeps it
        # outside the per-test pytest timeout; the builder caches the
        # result under the runner's temp root for the rest of the job.
        run: uv run python -c "from agency.sandbox.chroot_template import chroot_template_dir; assert chroot_template_dir() is not None"

      - name: Run pytest (shard ${{ matrix.shard }} of 8)
        # -rs lists every skipped test with its reason, so any backend that
        # silently stopped running shows up in the log.
        run: uv run pytest -rs $(uv run python -c "from tests.ci_shards import sandbox_shard_files; print(' '.join(sandbox_shard_files(${{ matrix.shard }})))")

  # Everything outside tests/sandbox and tests/harness: no container
  # lifecycles, no cgroup throughput assertions, no wall-clock budgets --
  # safe to run in parallel with pytest-xdist. -n auto spawns one worker
  # per core, so this job automatically scales if the runner size
  # increases later.
  general:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install -e ".[dev]"

      - name: Install harness CLIs
        # Needed by test_golden_execution, which runs real containers with
        # pinned harness CLIs (it fails rather than skips under CI).
        # Same retry discipline as the sandbox shards: the download comes
        # from an external CDN that occasionally times out under bursts.
        run: |
          for attempt in 1 2 3; do
            uv run agency install-harnesses && break
            echo "install-harnesses attempt $attempt failed; retrying..."
            sleep 10
            if [ "$attempt" = "3" ]; then exit 1; fi
          done

      - name: Run pytest in parallel
        run: uv run pytest -rs -n auto tests --ignore=tests/sandbox --ignore=tests/harness
