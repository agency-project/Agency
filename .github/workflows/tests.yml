name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run profiler JavaScript tests
        run: node --test tests/agwebui/*.test.mjs tests/agwebui/test_live_follow.cjs

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install -e ".[dev]"

      - name: Install harness CLIs
        # The versions pinned in pyproject.toml ([tool.agency.harnesses]), put
        # where Agency looks for them (~/.agency/harnesses): self-contained
        # binaries, with no Node.js needed in the sandbox image.
        run: uv run agency install-harnesses

      - name: Run pytest
        run: uv run pytest
