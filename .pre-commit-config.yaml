repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # codex_prompt.md is Codex's own prompt, byte for byte (adapters/codex.py).
      - id: trailing-whitespace
        exclude: ^agency/harness/adapters/codex_prompt\.md$
      - id: end-of-file-fixer
        exclude: ^agency/harness/adapters/codex_prompt\.md$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-cleanup-returns
        name: no bare return in cleanup functions
        entry: python tests/check_cleanup_returns.py
        language: python
        types: [python]
        exclude: ^tests/
      - id: check-ci-shard-coverage
        name: every sandbox/harness test file is in a CI shard
        entry: python tests/check_ci_shard_coverage.py
        language: python
        pass_filenames: false
        files: ^(tests/(sandbox|harness)/.*\.py|tests/ci_shards\.py)$
